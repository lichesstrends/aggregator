[package]
name = "lta"
version = "0.2.0"
edition = "2021"
description = "LichessTrends Aggregator - Fast streaming aggregator for Lichess PGN dumps"

[[bin]]
name = "lta"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.49", features = ["rt-multi-thread", "macros"] }
sqlx  = { version = "0.7.4", features = [
  "sqlite",
  "postgres",
  "mysql",
  "runtime-tokio-rustls",
  "macros",
  "migrate"
] }
dotenvy = "0.15.7"
anyhow = "1.0"
rayon = "1.11"
zstd    = "0.13.3"
regex   = "1.12"
chrono  = { version = "0.4.43", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde   = { version = "1.0", features = ["derive"] }
toml    = "0.8"
sha2    = "0.10.9"
hex     = "0.4.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
